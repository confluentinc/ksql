# DP-20611 experiment: ksql Maven vs Bazel CI wall times across agent sizes
# (amd64-1..5 = 4/8/16/32/64 vCPU, 2 GiB per vCPU). Run manually
# (workflows_run with this pipeline_file); not wired into the ServiceBot-managed
# semaphore.yml. Remove before merge.
version: v1.0
name: timing-sweep
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-3

execution_time_limit:
  hours: 8

global_job_config:
  env_vars:
    - name: BZL_FLAGS
      value: "--remote_cache= --repository_cache=/home/semaphore/bazel-repo-cache --disk_cache=/home/semaphore/bazel-disk-cache"
  prologue:
    commands:
      - checkout
      - nproc; free -g
      # A sourced setup script can leave `set -e` on, so record the exit code with `|| rc=$?`.
      - t() { local s=$SECONDS rc=0; "${@:2}" || rc=$?; echo "TIMING $1 rc=$rc $((SECONDS - s))s" | tee -a ~/timing.txt; }

blocks:
  # Warm the dependency caches once (all lanes are amd64), like CI's `cache-maven restore`. Not timed.
  - name: Fetch
    dependencies: []
    task:
      jobs:
        - name: Fetch
          commands:
            - bazel run //:update_bazel_credential_helper $BZL_FLAGS
            - bazel fetch //... $BZL_FLAGS
            - cache store bazel-repo-$SEMAPHORE_WORKFLOW_ID /home/semaphore/bazel-repo-cache

  - name: Warm m2
    dependencies: []
    task:
      prologue:
        commands:
          - . set-cp-java-version
      jobs:
        - name: Warm m2
          commands:
            - mvn -Dmaven.gitcommitid.nativegit=true -U -Dmaven.wagon.http.retryHandler.count=10 --batch-mode --no-transfer-progress install -DskipTests
            - cache store maven-m2-$SEMAPHORE_WORKFLOW_ID ~/.m2/repository

  # amd64-1: Bazel on a fresh agent (deps warm, no build cache), then a fresh agent restoring that disk cache.
  - name: Bazel cold amd64-1
    dependencies: ["Fetch"]
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-amd64-1
      prologue:
        commands:
          # Scale the server heap with the agent (a fixed 2 GB ran out of memory on amd64-5);
          # size test parallelism by the remaining RAM (~3 GB per embedded-Kafka test JVM).
          - MEM=$(free -g | awk '/Mem:/{print $2}'); H=$(( MEM / 8 )); [ "$H" -lt 2 ] && H=2; [ "$H" -gt 16 ] && H=16; echo "startup --host_jvm_args=-Xmx${H}g" >> ~/.bazelrc; echo "server_heap=${H}g"
          - MEM=$(free -g | awk '/Mem:/{print $2}'); J=$(( (MEM - H - 1) / 3 )); [ "$J" -gt "$(nproc)" ] && J=$(nproc); [ "$J" -lt 1 ] && J=1; export BZL_TEST_FLAGS="--local_test_jobs=$J"; echo "local_test_jobs=$J"
          - cache restore bazel-repo-$SEMAPHORE_WORKFLOW_ID
          - bazel run //:update_bazel_credential_helper $BZL_FLAGS
      jobs:
        - name: Bazel cold amd64-1
          commands:
            - t cold-build bazel build //... $BZL_FLAGS
            - t cold-test bazel test //... $BZL_FLAGS $BZL_TEST_FLAGS
            - t cold-noop-build bazel build //... $BZL_FLAGS
            - cache store bazel-disk-$SEMAPHORE_WORKFLOW_ID-1 /home/semaphore/bazel-disk-cache
      epilogue:
        always:
          commands:
            - artifact push workflow ~/timing.txt --destination timing-bazel-cold-amd64-1.txt || true

  - name: Bazel warm amd64-1
    dependencies: ["Bazel cold amd64-1"]
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-amd64-1
      prologue:
        commands:
          # Scale the server heap with the agent (a fixed 2 GB ran out of memory on amd64-5);
          # size test parallelism by the remaining RAM (~3 GB per embedded-Kafka test JVM).
          - MEM=$(free -g | awk '/Mem:/{print $2}'); H=$(( MEM / 8 )); [ "$H" -lt 2 ] && H=2; [ "$H" -gt 16 ] && H=16; echo "startup --host_jvm_args=-Xmx${H}g" >> ~/.bazelrc; echo "server_heap=${H}g"
          - MEM=$(free -g | awk '/Mem:/{print $2}'); J=$(( (MEM - H - 1) / 3 )); [ "$J" -gt "$(nproc)" ] && J=$(nproc); [ "$J" -lt 1 ] && J=1; export BZL_TEST_FLAGS="--local_test_jobs=$J"; echo "local_test_jobs=$J"
          - cache restore bazel-repo-$SEMAPHORE_WORKFLOW_ID
          - bazel run //:update_bazel_credential_helper $BZL_FLAGS
      jobs:
        - name: Bazel warm amd64-1
          commands:
            - cache restore bazel-disk-$SEMAPHORE_WORKFLOW_ID-1
            - t warm-build bazel build //... $BZL_FLAGS
            - t warm-test bazel test //... $BZL_FLAGS $BZL_TEST_FLAGS
      epilogue:
        always:
          commands:
            - artifact push workflow ~/timing.txt --destination timing-bazel-warm-amd64-1.txt || true

  # ksql CI's Test job command; -fae + failure.ignore so one flaky test can't cut the timing short.
  - name: Maven amd64-1
    dependencies: ["Warm m2"]
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-amd64-1
      prologue:
        commands:
          - . set-cp-java-version
          - cache restore maven-m2-$SEMAPHORE_WORKFLOW_ID
      jobs:
        - name: Maven amd64-1
          commands:
            - t mvn-clean-install bash -c 'mvn -Dmaven.gitcommitid.nativegit=true -U -Dmaven.wagon.http.retryHandler.count=10 --batch-mode --no-transfer-progress -fae -Dmaven.test.failure.ignore=true clean install 2>&1 | tee mvn.log | grep -E "Tests run:.*Fail|Reactor Summary| SUCCESS \[| FAILURE \[| SKIPPED|BUILD|Total time"; exit ${PIPESTATUS[0]}'
      epilogue:
        always:
          commands:
            - artifact push workflow ~/timing.txt --destination timing-maven-amd64-1.txt || true

